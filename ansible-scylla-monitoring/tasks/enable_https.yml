---

- name: Check if remote certificate already exists
  stat:
    path: "{{ item }}"
  loop:
    - "{{ grafana_cert_path }}"
    - "{{ grafana_cert_key_path }}"
  register: _grafana_cert_and_key_remote_files

- name: Fail if a certificate exists in the remote host but a key doesn't or vice versa
  fail:
    msg: "A certificate or a key already exist in the remote host"
  when:
    - _grafana_cert_and_key_remote_files[0].stat.exists or _grafana_cert_and_key_remote_files[1].stat.exists
    - not (_grafana_cert_and_key_remote_files[0].stat.exists and _grafana_cert_and_key_remote_files[1].stat.exists)

- name: Generate SSL certificate and key
  include_tasks: generate_certificates.yml
  vars:
    - _localhost_cert_path: "{{ grafana_cert_path }}"
    - _localhost_cert_key_path: "{{ grafana_cert_key_path }}"

- name: Copy SSL certificate and key
  block:
    - name: Copy SSL certificate
      copy:
        src: "{{ grafana_localhost_cert_path }}"
        dest: "{{ grafana_cert_path }}"
        mode: '0644'

    - name: Copy SSL certificate key
      copy:
        src: "{{ grafana_localhost_cert_key_path }}"
        dest: "{{ grafana_cert_key_path }}"
        mode: '0644'
  when: not _grafana_cert_and_key_remote_files[0].stat.exists and not _grafana_cert_and_key_remote_files[1].stat.exists

- name: Set grafana_root_url
  set_fact:
    grafana_root_url: "https://localhost:3000"
  when: grafana_root_url is not defined

# FIXME: Think about a way of changing the file permissions inside the docker container together with the -v
#        A possible problem is the fact that the permissions outside will already be wrong
- name: Update monitoring params
  set_fact:
    _scylla_monitoring_params: "{{ _scylla_monitoring_params }} -c GF_SERVER_PROTOCOL=https -D \" -v {{ grafana_cert_path }} -v {{ grafana_cert_key_path }}\" -c GF_SERVER_CERT_FILE=\"{{ grafana_cert_path }}\" -c GF_SERVER_CERT_KEY=\"{{ grafana_cert_key_path }}\""
